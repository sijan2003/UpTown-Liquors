<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Uptown Liquor Shop</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="overlay"></div>

    <!-- Age Verification Popup -->
    <div id="age-verification" role="dialog" aria-labelledby="age-verification-title">
        <div class="popup-content">
            <h2 id="age-verification-title">Are you 18 or older?</h2>
            <button id="yes-btn" aria-label="Confirm age 18 or older">Yes</button>
            <button id="no-btn" aria-label="Deny age 18 or older">No</button>
        </div>
    </div>

    <!-- Header -->
    <header>
        <div class="logo">
            <img src="images\Uptown Liquor Shop logo.jpg" alt="Uptown Liquor Shop Brand Logo" class="logo-img">
        </div>
        <nav aria-label="Main navigation">
            <a href="#home">Home</a>
            <a href="#products">Products</a>
            <a href="#contact">Contact</a>
        </nav>
    </header>

    <!-- Search Bar -->
    <div class="search-container">
        <input type="text" id="search-input" placeholder="Search for liquor..." aria-label="Search products">
    </div>

    <!-- Categories -->
    <div class="categories" role="tablist">
        <button class="category-btn active" data-category="all" role="tab" aria-selected="true">All</button>
        <button class="category-btn" data-category="Whiskey" role="tab" aria-selected="false">Whiskey</button>
        <button class="category-btn" data-category="Wine" role="tab" aria-selected="false">Wine</button>
        <button class="category-btn" data-category="Beer" role="tab" aria-selected="false">Beer</button>
        <button class="category-btn" data-category="Vodka" role="tab" aria-selected="false">Vodka</button>
        <button class="category-btn" data-category="Rum" role="tab" aria-selected="false">Rum</button>
        <button class="category-btn" data-category="Softdrinks" role="tab" aria-selected="false">Soft Drinks</button>
    </div>

    <!-- Products -->
    <div class="products" id="products" aria-live="polite">
        <div class="loading" id="loading">Loading products...</div>
    </div>

    <!-- Cart -->
    <div class="cart" id="cart" role="region" aria-label="Shopping cart">
        <button class="close-cart" aria-label="Close cart">✕</button>
        <h2>Your Cart</h2>
        <div id="cart-items"></div>
        <div id="cart-total">Total: NPR 0</div>
        <button class="checkout-btn" disabled>Checkout</button>
        <div class="cart-note">Cash on Delivery Available</div>
    </div>

    <!-- Cart Icon -->
    <div class="cart-icon" id="cart-icon" role="button" aria-label="Open cart" tabindex="0">
        🛒
        <span class="cart-count" id="cart-count">0</span>
    </div>

    <!-- Toast Notification -->
    <div class="toast" id="toast" aria-live="assertive"></div>

    <!-- Contact Section -->
    <section id="contact" aria-labelledby="contact-title">
        <h2 id="contact-title">Contact Us</h2>
        <p>Phone: +977-123-456-7890</p>
        <p>Email: info@uptownliquorshop.com</p>
        <p>Address: Uptown Liquor Shop, Kathmandu, Nepal</p>
    </section>

    <!-- Footer -->
    <footer>
        <p>Uptown Liquor Shop © 2025 | Kathmandu, Nepal</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
